name: Stress

# Repeats the traffic switch under load on several runners at once, to catch
# races a single deploy rarely hits. Run it by hand, or push a stress/ branch.
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: Switches per runner
        default: "40"
  push:
    branches: ["stress/**"]

permissions:
  contents: read

jobs:
  switches:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Stress the traffic switch
        env:
          ZYMPLE_E2E_STRESS: ${{ inputs.cycles || '40' }}
        run: ./scripts/e2e.sh -v -run TestStressSwitches
